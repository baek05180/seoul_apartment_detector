name: 실거래 데이터 업데이트

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국시간 06:17
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능
    inputs:
      probe:
        description: "접속 진단만 실행"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]   # 화면 코드만 바꿨을 때는 배포만

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 국토부 실거래 수집
        if: github.event_name != 'push'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MONTHS: "6"
          PROBE: ${{ inputs.probe && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          mkdir -p diag
          set -o pipefail
          python scripts/fetch_molit.py 2>&1 | tee diag/last_run.log

      - name: 실행 기록 저장
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/last_run.log
          git diff --cached --quiet || (git commit -m "실행 기록 $(TZ=Asia/Seoul date +'%m-%d %H:%M')" && git push)

      - name: 데이터 저장(커밋)
        if: github.event_name != 'push' && !inputs.probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q
          git add site/data/summary.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "실거래 데이터 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.probe }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.probe }}
        with:
          path: site
      - id: deploy
        if: ${{ !inputs.probe }}
        uses: actions/deploy-pages@v4
