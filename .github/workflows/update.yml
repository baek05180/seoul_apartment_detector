name: 실거래 데이터 업데이트

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국시간 06:17
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능
    inputs:
      probe:
        description: "접속 진단만 실행"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]   # 화면 코드만 바꿨을 때는 배포만

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 단지정보·금리·실거래 수집
        if: github.event_name != 'push'
        shell: bash
        env:
          MONTHS: "6"
          TIME_BUDGET_MIN: "20"
          PROBE: ${{ inputs.probe && '1' || '0' }}
        run: |
          mkdir -p diag
          set -o pipefail
          {
            echo "== $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') =="
            if [ "$PROBE" != "1" ]; then
              echo "-- 단지정보(엑셀) --"; pip install -q openpyxl && python scripts/fetch_kapt_excel.py || echo "(엑셀 단계 실패, 계속 진행)"
              echo "-- 단지정보(API) --"; python scripts/fetch_complex.py || echo "(단지정보 단계 실패, 계속 진행)"
              echo "-- 금리 --";     python scripts/fetch_rate.py    || echo "(금리 단계 실패, 계속 진행)"
            fi
            echo "-- 실거래 --";     python scripts/fetch_molit.py
          } 2>&1 | tee diag/last_run.log

      - name: 결과 저장(커밋)
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/last_run.log
          if [ "${{ inputs.probe }}" != "true" ]; then
            git add -A site/data
            [ -d data ] && git add -A data
          fi
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git pull --rebase -q
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.probe }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.probe }}
        with:
          path: site
      - id: deploy
        if: ${{ !inputs.probe }}
        uses: actions/deploy-pages@v4
